<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astral Fantasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120e1f;--fg:#f6ecc9;--ac:#ffd23f;--pn:rgba(18,14,31,.82);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0a18;--fg:#f6ecc9;--ac:#ffd23f;--pn:rgba(13,10,24,.85)}}
:root[data-theme="dark"]{--bg:#0d0a18;--fg:#f6ecc9;--ac:#ffd23f;--pn:rgba(13,10,24,.85)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Courier New",Courier,monospace;overflow:hidden;touch-action:manipulation}
#wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px}
canvas{image-rendering:pixelated;width:min(100%,calc((100dvh - 170px)*16/9),960px);aspect-ratio:16/9;background:#000;border:3px solid #3a2f5e}
#pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}
#pad button{font:inherit;font-size:20px;background:#2b2347;color:var(--fg);border:2px solid #4b3f7a;border-radius:6px}
#pad button:active{background:#4b3f7a}
#pad button:focus-visible,#go:focus-visible{outline:3px solid var(--ac)}
@media (hover:hover) and (pointer:fine){#pad{display:none}canvas{width:min(100%,calc((100dvh - 40px)*16/9),960px)}}
#load{position:fixed;inset:0;background:#000;z-index:5;transition:opacity .6s}
#load.out{opacity:0;pointer-events:none}
#load img{width:100%;height:100%;object-fit:cover;display:block}
.panel{position:absolute;left:0;right:0;bottom:0;padding:18px 6vw calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--pn) 40%)}
h1{font-family:Cinzel,Georgia,serif;margin:0 0 10px;font-size:clamp(28px,6vw,56px);letter-spacing:.06em;color:var(--ac);text-shadow:3px 3px 0 #7a1f1f}
.bar{height:14px;border:3px solid var(--fg);background:#1b1530;max-width:520px}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .12s}
#tip{margin:8px 0 0;font-size:14px;min-height:20px}
#load.rdy #tip{color:var(--ac);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#load.rdy #tip{animation:none}}

#hud .t{position:absolute;left:35%;width:54%;transform:translateY(-50%);white-space:nowrap;text-align:center}
#cur{position:absolute;right:2vw;top:calc(2vw + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cb{position:relative;height:clamp(30px,3.7vw,50px);color:#fff;text-shadow:1px 1px 2px #000;font-weight:600;font-size:clamp(12px,1.4vw,18px)}
.cb.g{aspect-ratio:248/68;background:var(--gold) center/100% 100%}
.cb.m{aspect-ratio:208/68;background:var(--gem) center/100% 100%}
.cb span{position:absolute;left:26%;right:24%;top:50%;transform:translateY(-50%);text-align:right}
#logo{position:absolute;left:34vw;right:22vw;top:calc(1.5vw + env(safe-area-inset-top,0px));text-align:center;font:800 clamp(24px,3.8vw,62px)/1.1 Cinzel,Georgia,serif;letter-spacing:.08em;background:linear-gradient(#fff3c4,#e8b84a 55%,#a6641c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a1c05) drop-shadow(0 0 14px rgba(255,200,90,.35));pointer-events:none}
#menu{position:absolute;left:2vw;top:calc(14vw + env(safe-area-inset-top,0px));width:clamp(180px,20vw,300px);display:flex;flex-direction:column;gap:8px}
#menu button{height:clamp(40px,4.2vw,56px);border:0;background:var(--btn) center/100% 100% no-repeat transparent;color:#f6e6b4;font:600 clamp(14px,1.5vw,20px) Cinzel,Georgia,serif;text-align:left;padding-left:16%;cursor:pointer;text-shadow:1px 1px 2px #000}
#menu button:hover,#menu button:focus-visible{filter:brightness(1.35) saturate(1.2);outline:none;color:#fff}
#menu button.dis{opacity:.55}
@media (max-aspect-ratio:1/1){#hud{--w:clamp(190px,46vw,300px)}#logo{left:0;right:0;top:calc(34vw + env(safe-area-inset-top,0px));font-size:9vw}#menu{left:50%;transform:translateX(-50%);top:auto;bottom:calc(4vh + env(safe-area-inset-bottom,0px));width:min(80vw,320px)}}
#modal{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:rgba(5,4,12,.6);font-family:Cinzel,Georgia,serif}
#mbox{width:min(90vw,520px);aspect-ratio:282/214;background:var(--panel) center/100% 100% no-repeat;padding:11% 12% 8%;text-align:center;color:#f6e6b4;display:flex;flex-direction:column;justify-content:space-between;align-items:center;font-size:clamp(12px,2.2vw,16px)}
#mbox h2{margin:0;color:#ffd23f;font-size:1.5em}#mbox p{margin:0;line-height:1.4}
#mok{width:130px;height:38px;border:0;background:var(--pill) center/100% 100% no-repeat transparent;color:#fff;font:600 15px Cinzel,Georgia,serif;cursor:pointer}
#mok:focus-visible{outline:3px solid var(--ac)}
#hb{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:3;font:600 13px Cinzel,Georgia,serif;color:#f6e6b4;background:#2b2347;border:2px solid #b07a2a;border-radius:6px;padding:6px 10px;cursor:pointer}
#hb:focus-visible{outline:3px solid var(--ac)}

<div class="panel"><h1>Astral Fantasy</h1><div class="bar"><i id="fill"></i></div><p id="tip">Loading…</p></div></div>
<script>
const cv=document.getElementById('g'),c=cv.getContext('2d');
const VW=320,VH=180,T=16,W=40,H=30;cv.width=VW;cv.height=VH;
const R=n=>Math.floor(Math.random()*n);
const PAL={G:'#3a9d4f',s:'#f2c9a0',K:'#1b1b1b',b:'#3d6fd1',k:'#5a3a22',g:'#6fd36f',w:'#fff',p:'#8a4fd1',r:'#ff4040'};
const SP={
h:["..GGGG..",".GGGGGG.",".GssssG.",".sKssKs.","..bbbb..",".bbbbbb.",".b.bb.b.","..k..k.."],
s:["........","..gggg..",".gggggg.","gwKggKwg","gggggggg","gggggggg",".gggggg.","........"],
b:["p......p","pp.pp.pp","ppprrppp",".pppppp.","..pppp..","...pp...","........","........"]};
function spr(k,px,py){SP[k].forEach((row,j)=>{for(let i=0;i<8;i++){const ch=row[i];if(ch!=='.'){c.fillStyle=PAL[ch];c.fillRect(px+i*2,py+j*2,2,2)}}})}
let map,seen,P,E,items,stairs,floor=1,score=0,msg='',state='load',flash=0,rooms;
function gen(){
map=Array.from({length:H},()=>Array(W).fill(1));seen=Array.from({length:H},()=>Array(W).fill(false));rooms=[];
for(let i=0;i<80&&rooms.length<9;i++){
const w=4+R(6),h=4+R(4),x=1+R(W-w-2),y=1+R(H-h-2);
if(rooms.some(r=>x<r.x+r.w+1&&x+w+1>r.x&&y<r.y+r.h+1&&y+h+1>r.y))continue;
for(let j=y;j<y+h;j++)for(let k=x;k<x+w;k++)map[j][k]=0;
rooms.push({x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)})}
for(let i=1;i<rooms.length;i++){const a=rooms[i-1],b=rooms[i];
for(let x=Math.min(a.cx,b.cx);x<=Math.max(a.cx,b.cx);x++)map[a.cy][x]=0;
for(let y=Math.min(a.cy,b.cy);y<=Math.max(a.cy,b.cy);y++)map[y][b.cx]=0}
const f=rooms[0],l=rooms[rooms.length-1];
P=Object.assign(P||{hp:10,max:10},{x:f.cx,y:f.cy});
stairs={x:l.cx,y:l.cy};E=[];items=[];
const rp=r=>({x:r.x+R(r.w),y:r.y+R(r.h)});
const taken=(p)=>(p.x==P.x&&p.y==P.y)||(p.x==stairs.x&&p.y==stairs.y)||E.some(e=>e.x==p.x&&e.y==p.y)||items.some(e=>e.x==p.x&&e.y==p.y);
for(let i=1;i<rooms.length;i++){const n=R(2)+Math.min(3,1+(floor>>1));
for(let j=0;j<n;j++){const p=rp(rooms[i]);if(taken(p))continue;const bat=Math.random()<.4;E.push({...p,k:bat?'b':'s',hp:bat?1:2+(floor>2?1:0),dmg:floor>3?2:1,t:0})}
for(let j=0;j<R(3);j++){const p=rp(rooms[i]);if(!taken(p))items.push({...p,t:Math.random()<.3?'p':'g'})}}
reveal();save();msg='Floor '+floor+'. Find the stairs.'}
function newGame(){P=null;floor=1;score=0;state='play';gen()}
const $=id=>document.getElementById(id),home=$('home'),modal=$('modal');
const sv=()=>{try{return JSON.parse(localStorage.getItem('af'))}catch(e){return null}};
function save(){try{localStorage.setItem('af',JSON.stringify({floor,score,hp:P.hp,max:P.max}))}catch(e){}}
function showHome(){state='home';const s=sv();home.hidden=false;requestAnimationFrame(()=>home.classList.add('in'));
$('hHp').textContent='Lv. '+(s?s.floor:1)+'   HP '+(s?s.hp:10)+'/'+(s?s.max:10);$('hMp').textContent='MP 5/5';$('hXp').textContent='Best floor '+(s?s.floor:1);
$('cGold').textContent=s?s.score:0;$('cGem').textContent=s?s.floor:1;document.querySelector('[data-a=continue]').classList.toggle('dis',!s)}
function hideHome(){home.classList.remove('in');home.hidden=true}
function box(t,p){$('mt').textContent=t;$('mp').textContent=p;modal.hidden=false;$('mok').focus()}
$('mok').onclick=()=>{modal.hidden=true};$('hb').onclick=()=>{if(state!=='home'&&state!=='load')showHome()};
$('menu').addEventListener('click',e=>{const a=e.target.closest('button');if(!a)return;const k=a.dataset.a,s=sv();
if(k==='continue'){if(!s)return box('No save yet','Start a New Game first. Your progress is saved at the start of each floor.');hideHome();P={hp:s.hp,max:s.max};floor=s.floor;score=s.score;state='play';gen()}
else if(k==='new'){hideHome();newGame()}
else if(k==='char')box('Rin','Lv. '+(s?s.floor:1)+' adventurer. HP '+(s?s.max:10)+', MP 5. Best floor: '+(s?s.floor:1)+'.');
else if(k==='inv')box('Inventory','Your pack is empty. Potions and gems you find are used right away.');
else if(k==='set')box('Settings','Move with arrow keys or WASD. Esc returns home. Sound options are coming soon.');
else box('Quit','Thanks for playing Astral Fantasy! Close this tab to leave.')});
function reveal(){for(let y=-6;y<=6;y++)for(let x=-6;x<=6;x++){const X=P.x+x,Y=P.y+y;if(X>=0&&Y>=0&&X<W&&Y<H&&x*x+y*y<=36)seen[Y][X]=true}}
const free=(x,y)=>map[y]&&map[y][x]===0&&!E.some(e=>e.x==x&&e.y==y)&&!(P.x==x&&P.y==y);
function enemies(){
for(const e of E){
const dx=P.x-e.x,dy=P.y-e.y,d=Math.abs(dx)+Math.abs(dy);
if(d===1){P.hp-=e.dmg;flash=8;msg=(e.k=='b'?'Bat':'Slime')+' hits you! -'+e.dmg;continue}
if(d>7)continue;
if(e.k=='s'){e.t^=1;if(e.t)continue}
const sx=Math.sign(dx),sy=Math.sign(dy);
let o=Math.abs(dx)>Math.abs(dy)?[[sx,0],[0,sy]]:[[0,sy],[sx,0]];
if(e.k=='b'&&Math.random()<.4){const q=[[1,0],[-1,0],[0,1],[0,-1]];o=[q[R(4)]]}
for(const[mx,my]of o){if((mx||my)&&free(e.x+mx,e.y+my)){e.x+=mx;e.y+=my;break}}}
if(P.hp<=0){P.hp=0;state='over';msg='You fell on floor '+floor}}
function act(dx,dy){
if(state!=='play')return;
const nx=P.x+dx,ny=P.y+dy,e=E.find(q=>q.x==nx&&q.y==ny);
if(e){e.hp--;msg='You strike!';if(e.hp<=0){E=E.filter(q=>q!==e);score+=5;msg='Enemy defeated! +5'}}
else if(map[ny]&&map[ny][nx]===0){P.x=nx;P.y=ny;
const it=items.find(q=>q.x==nx&&q.y==ny);
if(it){items=items.filter(q=>q!==it);if(it.t=='p'){P.hp=Math.min(P.max,P.hp+4);msg='Potion! +4 HP'}else{score+=10;msg='Gem! +10'}}
if(nx==stairs.x&&ny==stairs.y){floor++;gen();return}}
else return;
enemies();reveal()}
function draw(){
c.fillStyle='#000';c.fillRect(0,0,VW,VH);
if(map&&state!=='load'){
const cx=Math.round(Math.max(0,Math.min(W*T-VW,P.x*T+8-VW/2))),cy=Math.round(Math.max(0,Math.min(H*T-VH,P.y*T+8-VH/2)));

for(let y=y0;y<=y0+12&&y<H;y++)for(let x=x0;x<=x0+21&&x<W;x++){
if(!seen[y][x])continue;const px=x*T-cx,py=y*T-cy;
if(map[y][x]===0){c.fillStyle=(x+y)%2?'#3b3354':'#403862';c.fillRect(px,py,T,T);
const h=(x*7+y*13)%5;c.fillStyle='#2f2848';if(h<2)c.fillRect(px+3+h*4,py+5+h*3,2,2)}
else{c.fillStyle='#1d1830';c.fillRect(px,py,T,T);
if(map[y+1]&&map[y+1][x]===0){c.fillStyle='#5a4d85';c.fillRect(px,py,T,T);c.fillStyle='#7d6eae';c.fillRect(px,py,T,3);
c.fillStyle='#3f3563';c.fillRect(px,py+8,T,1);c.fillRect(px+(y%2?4:10),py+3,1,5);c.fillRect(px+(y%2?10:4),py+9,1,6)}}
if(!vis(x,y)){c.fillStyle='rgba(0,0,0,.55)';c.fillRect(px,py,T,T)}}
const sx=stairs.x*T-cx,sy=stairs.y*T-cy;
if(seen[stairs.y][stairs.x]){for(let i=0;i<4;i++){c.fillStyle=['#c9b98a','#a8996c','#85784f','#615739'][i];c.fillRect(sx+2+i,sy+2+i*3,12-i*2,3)}}
for(const it of items){if(!vis(it.x,it.y))continue;const px=it.x*T-cx,py=it.y*T-cy;
if(it.t=='p'){c.fillStyle='#e34a4a';c.fillRect(px+4,py+6,8,8);c.fillStyle='#8a5a2b';c.fillRect(px+6,py+3,4,3);c.fillStyle='#ffb3b3';c.fillRect(px+5,py+8,2,3)}
else{c.fillStyle='#38e1e8';c.fillRect(px+6,py+3,4,10);c.fillRect(px+4,py+5,8,6);c.fillStyle='#c9fbff';c.fillRect(px+6,py+5,2,3)}}
for(const e of E)if(vis(e.x,e.y))spr(e.k,e.x*T-cx,e.y*T-cy);
spr('h',P.x*T-cx,P.y*T-cy);
if(flash>0){c.fillStyle='rgba(255,40,40,'+flash/20+')';c.fillRect(0,0,VW,VH);flash--}

c.font='8px "Courier New",monospace';c.textBaseline='top';c.fillStyle='#f6ecc9';
c.fillText('HP '+P.hp+'/'+P.max+'   Floor '+floor+'   Gems '+score,74,4);
c.fillText(msg,4,VH-11);
if(state==='over'){c.fillStyle='rgba(10,8,20,.8)';c.fillRect(0,60,VW,60);c.fillStyle='#ffd23f';c.font='bold 16px "Courier New",monospace';c.textAlign='center';
c.fillText('YOU DIED',VW/2,68);c.font='8px "Courier New",monospace';c.fillStyle='#f6ecc9';c.fillText('Floor '+floor+'  Score '+score,VW/2,90);c.fillText('Press Enter or tap to retry',VW/2,102);c.textAlign='left'}}
requestAnimationFrame(draw)}
const K={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0],' ':[0,0]};
const ld=document.getElementById('load'),fill=document.getElementById('fill'),tip=document.getElementById('tip');

if(pr>=100){ready=true;clearInterval(iv);ld.classList.add('rdy');tip.textContent='Press any key or tap to start'}else tip.textContent=tips[pr/26|0]},120);

addEventListener('keydown',e=>{
if(state==='load'){if(ready)start();return}

if(state==='over'){if(e.key==='Enter'||e.key===' ')newGame();return}
const m=K[e.key]||K[e.key.toLowerCase()];if(m){e.preventDefault();act(m[0],m[1])}});
ld.addEventListener('pointerdown',()=>{if(ready&&state==='load')start()});
cv.addEventListener('pointerdown',()=>{if(state==='over')newGame()});
document.querySelectorAll('#pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();const[d,f]=b.dataset.d.split(',').map(Number);act(d,f)}));
draw();
